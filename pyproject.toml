[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Exists so `multirag` imports from any launcher - `streamlit run` puts the
# script's own folder on sys.path, not the repo root. Dependencies deliberately
# stay in requirements.txt: that file is the pinned, phase-by-phase record, and
# a second copy here would drift from it.
[project]
name = "multirag"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["multirag*"]
